name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  release:
    # Tag vX.Y.Z (matching dupefinder.__version__) to publish DupeFinder.exe.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Check tag matches version
        shell: pwsh
        run: |
          $version = python -c "import dupefinder; print(dupefinder.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != version v$version" }
      - name: Build exe
        shell: pwsh
        run: ./build.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/DupeFinder.exe --title "DupeFinder ${{ github.ref_name }}" --generate-notes
