[project]
name = "dupefinder"
dynamic = ["version"]
description = "Finds exact and visually similar duplicate photos and moves them aside — fully offline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2",
    "Pillow>=10.0",
    "imagehash>=4.3",
    "numpy>=1.24",
    "pillow-heif>=0.13",
    "Send2Trash>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.gui-scripts]
dupefinder = "dupefinder.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "dupefinder.__version__" }

[tool.setuptools.package-data]
dupefinder = ["icon.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
